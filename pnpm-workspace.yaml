allowBuilds:
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: true

# postcss <8.5.18 carries two high-severity advisories (GHSA-6g55-p6wh-862q,
# GHSA-r28c-9q8g-f849) and reaches us transitively through next. Pin the patched
# range rather than lowering the CI audit threshold, which would weaken a guard.
overrides:
  postcss: '>=8.5.18'
