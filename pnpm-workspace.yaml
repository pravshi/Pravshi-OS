allowBuilds:
  "@sentry/cli": true
  esbuild: true
  unrs-resolver: true

# postcss <8.5.18 carries two high-severity advisories (GHSA-6g55-p6wh-862q,
# GHSA-r28c-9q8g-f849) and reaches us transitively through next. Pin the patched
# range rather than lowering the CI audit threshold, which would weaken a guard.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

overrides:
  postcss: ">=8.5.18"
  # brace-expansion carries high-severity DoS advisories (GHSA-6j4f-fj2g-mc7p et al)
  # and reaches us transitively through minimatch (via @sentry/nextjs glob and
  # ts-morph). Both major lines are pinned to their patched releases.
  "minimatch>brace-expansion@1": 1.1.20
  "minimatch>brace-expansion@5": 5.0.11
