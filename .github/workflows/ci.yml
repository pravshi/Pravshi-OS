name: ci

# GitHub Free cannot mark this check as required — branch protection is unavailable
# on private repositories on this plan. CI is therefore MANDATORY BY ENGINEERING
# POLICY, not by platform enforcement. See CONTRIBUTING.md. A red run must block a
# merge because a human refuses to merge it, not because GitHub refused.

on:
  pull_request:
  push:
    branches: [main, develop]

# Least privilege. Nothing here writes to the repository.
permissions:
  contents: read

# One ephemeral database branch per ref, not one per push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A fixed, derivable name so cleanup can find the branch even if the job that
  # created it was cancelled.
  CI_BRANCH_NAME: ci/${{ github.event.number && format('pr-{0}', github.event.number) || format('ref-{0}', github.run_id) }}

jobs:
  # Static checks that need no database and no secrets. Fast, and they fail first.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Secret-shape scan (compensates for unavailable push protection)
        run: node scripts/guards/secret-scan.mjs

      # Semantic guard: no DATABASE_URL* may be populated from a GitHub secret, whether
      # bound directly, renamed through an intermediary, carried on a step output, or
      # assigned via shell indirection. Heuristic by design — see the script header.
      - name: No workflow may source a database URL from a GitHub secret
        run: node scripts/guards/workflow-secret-flow.mjs

      - run: pnpm format:check
      - run: pnpm audit --audit-level=high

  ci:
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Ephemeral Neon branch cut from the NON-PRODUCTION parent, with branch-only
      # credentials. The script refuses to branch from the default (production) branch.
      - name: Create ephemeral Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: staging
        run: node scripts/ci/provision-branch-role.mjs create

      - run: pnpm typecheck
      - run: pnpm lint

      # Migrations run as app_owner on the DIRECT host. app_owner owns the schema;
      # this is the only step that uses an owner connection.
      - name: Run migrations
        env:
          DATABASE_URL_MIGRATE: ${{ steps.neon.outputs.db_url_migrate }}
        run: pnpm exec drizzle-kit migrate

      # Tests run as app_user on the POOLED host — the role that cannot bypass RLS.
      # APP_URL is required because src/env.ts validates the runtime environment at
      # import time, and CI has no .env file.
      - name: Test
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_app }}
          DATABASE_URL_TEST: ${{ steps.neon.outputs.db_url_app }}
          DATABASE_URL_MIGRATE: ${{ steps.neon.outputs.db_url_migrate }}
          APP_URL: http://localhost:3000
        run: pnpm test

      - name: Build
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_app }}
          APP_URL: http://localhost:3000
        run: pnpm build

  # always(): the branch must die even when ci is cancelled or fails, on every event.
  cleanup:
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Delete ephemeral Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node scripts/ci/provision-branch-role.mjs delete
