name: test-neon-project-scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Neon project creation capability
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Testing if NEON_API_KEY can create projects..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://console.neon.tech/api/v2/projects \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"project":{"name":"scope-test-delete-me","region_id":"aws-ap-southeast-1"}}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY" | head -c 500
          if [ "$HTTP_CODE" = "201" ]; then
            echo "SUCCESS: Key can create projects"
            # Clean up: extract project ID and delete it
            PROJECT_ID=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('project',{}).get('id',''))")
            if [ -n "$PROJECT_ID" ]; then
              echo "Cleaning up test project $PROJECT_ID..."
              curl -s -X DELETE https://console.neon.tech/api/v2/projects/$PROJECT_ID \
                -H "Authorization: Bearer $NEON_API_KEY"
              echo "Cleanup done"
            fi
          else
            echo "FAILED: Key cannot create projects (HTTP $HTTP_CODE)"
          fi
