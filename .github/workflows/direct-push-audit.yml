name: direct-push-audit

# Detection, not prevention. GitHub Free cannot block a direct push to main, so this
# records one loudly instead. It opens no issue, tags nobody, changes no repository
# state, and requests no write permission — a failed run on main is the signal.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Determine whether this push arrived through a pull request
        run: |
          SUBJECT=$(git log -1 --format=%s)
          PARENTS=$(git log -1 --format=%P | wc -w)
          echo "commit: $(git log -1 --format=%h)"
          echo "subject: $SUBJECT"
          echo "parents: $PARENTS"

          # A PR merge is either a merge commit, or a squash/rebase merge whose
          # subject carries the "(#123)" reference GitHub appends.
          if [ "$PARENTS" -gt 1 ]; then
            echo "Merge commit — arrived through a pull request."
            exit 0
          fi
          if printf '%s' "$SUBJECT" | grep -qE '\(#[0-9]+\)$'; then
            echo "Squash/rebase merge referencing a pull request."
            exit 0
          fi

          echo "::error title=Direct push to main::Unexpected direct push to main detected. Policy violation: production changes must arrive through a PR."
          echo "Unexpected direct push to main detected. Policy violation: production changes must arrive through a PR."
          exit 1
