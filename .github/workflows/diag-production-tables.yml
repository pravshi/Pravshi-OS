name: diag-production-tables

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Get production connection URI
        id: conn
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          URI=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=br-billowing-grass-b3e7ckaz&database_name=neondb&role_name=neondb_owner&pooled=false" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['uri'])")
          echo "::add-mask::$URI"
          echo "uri=$URI" >> $GITHUB_OUTPUT

      - name: Diagnose production database
        env:
          PGURL: ${{ steps.conn.outputs.uri }}
        run: |
          echo "=== Table count in public schema ==="
          psql "$PGURL" -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"
          echo ""
          echo "=== List of tables ==="
          psql "$PGURL" -t -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;"
          echo ""
          echo "=== Drizzle migrations table ==="
          psql "$PGURL" -t -c "SELECT * FROM drizzle.__drizzle_migrations ORDER BY created_at DESC LIMIT 5;" 2>&1 || echo "No drizzle migrations table"
          echo ""
          echo "=== All schemas ==="
          psql "$PGURL" -t -c "SELECT schema_name FROM information_schema.schemata ORDER BY schema_name;"
