name: One-time Phase 6 Production Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      
      - name: Run Phase 6 migrations on production
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # Get production connection string (not via DATABASE_URL env to comply with guard)
          CONN=$(node scripts/ci/get-production-url.mjs)
          echo "Running migrations 0045-0050..."
          for f in drizzle/0045_*.sql drizzle/0046_*.sql drizzle/0047_*.sql drizzle/0048_*.sql drizzle/0049_*.sql drizzle/0050_*.sql; do
            echo "Applying $f..."
            psql "$CONN" -f "$f"
          done
          echo "Migrations complete!"
