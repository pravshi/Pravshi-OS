name: One-time Phase 6 Production Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      
      - name: Get production database URL via Neon API
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # Get connection URI for production branch (br-billowing-grass-b3e7ckaz)
          RESPONSE=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/floral-base-77155861/connection_uri?branch_id=br-billowing-grass-b3e7ckaz&database_name=neondb&role_name=neondb_owner")
          DB_URL=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['uri'])")
          echo "::add-mask::$DB_URL"
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT
      
      - name: Run Phase 6 migrations on production
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "Running migrations 0045-0050 on production..."
          pnpm exec drizzle-kit migrate
          echo "Migrations complete!"
